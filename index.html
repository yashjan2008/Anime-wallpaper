<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="checkbox"
    id="dark-toggle">
    <label for="dark-toggle" class="dark-btn">🌙Dark Mode</label>
    <h1 class="title">Anime Wallboards</h1>
    <div class="pint">
        <div class="pin">
            <a href="#view1"><img src="itachi.jpg"></a>
            <span class="tag">Itachi</span>
            <input type="checkbox" id="like1">
            <label for="like1" class="like">❤️</label>
        </div>
        <div class="pin">
            <a href="#view2"><img src="pain.jpg"></a>
            <span class="tag">Pain</span>
            <input type="checkbox" id="like2">
            <label for="like2" class="like">❤️</label>
        </div>
        <div class="pin">
            <a href="#view3"><img src="codein.png"></a>
            <span class="tag">Code</span>
            <input type="checkbox" id="like3">
            <label for="like3" class="like">❤️</label>
        </div>
    </div>
    <div id="view1" class="modal">
        <a href="#" class="overlay"></a>
        <img src="itachi.jpg">
    </div>
    <div id="view2" class="modal">
        <a href="#" class="overlay"></a>
        <img src="pain.jpg">
    </div>
    <div id="view3" class="modal">
        <a href="#" class="overlay"></a>
        <img src="codein.png">
    </div>
</body>
</html>
